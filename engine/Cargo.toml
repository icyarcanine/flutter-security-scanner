# Virtual workspace root for the flutter-security-scanner analysis engine.
#
# Everything in the Rust/WASM core lives under `crates/`. We intentionally
# avoid a root package so that `cargo build -p engine-core` and
# `cargo test -p engine-core` stay decoupled from crate-layout decisions we
# make later (semgrep ingestion, datalog pointer analysis, tree-sitter
# frontends — each will land as its own member crate).

[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-frontend-dart",
    "crates/engine-frontend-rust",
    "crates/engine-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
license      = "Apache-2.0"
authors      = ["flutter-security-scanner contributors"]
repository   = "https://github.com/dilpreet-s-sidhu/flutter-security-scanner"

# ---------------------------------------------------------------------------
# Pinned workspace dependencies. Member crates inherit via `.workspace = true`
# so every crate sees the exact same version of every dep, which kills a
# whole class of "two copies of `petgraph` in the dep tree" bugs.
# ---------------------------------------------------------------------------
[workspace.dependencies]

# -- Parsing / language frontends ------------------------------------------
tree-sitter        = "0.22"
tree-sitter-dart   = "0.0.4"
tree-sitter-rust   = "0.21"
# tree-sitter-typescript and tree-sitter-sql will be added when the TS and
# Postgres frontends land as separate crates.

# -- Graph / containers ----------------------------------------------------
petgraph   = "0.6"
smallvec   = { version = "1.13", features = ["union", "const_generics", "const_new"] }
rustc-hash = "2.0"
hashbrown  = "0.14"
indexmap   = "2.3"
bitvec     = "1.0"
bumpalo    = { version = "3.16", features = ["collections"] }

# -- Fixed-point / Datalog (Rust-native, no Soufflé / no C++) --------------
# `datafrog` is what rustc itself uses for its borrow-checker polonius
# engine; `crepe` gives us a macro-based Datalog DSL when we want ergonomic
# rule authoring.
datafrog = "2.0"
crepe    = "0.1"

# -- SMT -------------------------------------------------------------------
# Gated per-target in engine-core/Cargo.toml: Z3 statically linked on native
# builds, stubbed out on wasm32 until we ship a prebuilt z3.wasm sidecar.
z3 = { version = "0.12", default-features = false, features = ["static-link-z3"] }

# -- Serialization / Semgrep YAML ------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
bincode    = "1.3"

# -- Regex (for Semgrep metavariable-regex) --------------------------------
regex = "1.10"

# -- Persistence -----------------------------------------------------------
# RocksDB for incremental CPG caching. Native-only (feature-gated).
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }

# -- WASM bindings ---------------------------------------------------------
wasm-bindgen = "0.2"
js-sys       = "0.3"

# -- Concurrency -----------------------------------------------------------
crossbeam-channel = "0.5"
parking_lot       = "0.12"
rayon             = "1.10"

# -- Error handling / observability ---------------------------------------
thiserror = "1"
tracing   = "0.1"
once_cell = "1.19"

# ---------------------------------------------------------------------------
# Release profile: we build the hot path with LTO + single codegen unit. The
# analysis kernel is CPU-bound and benefits measurably from cross-crate
# inlining of the IFDS worklist loop and the CPG adjacency lookups.
# ---------------------------------------------------------------------------
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = 1        # keep line tables for SARIF attribution
strip         = "none"
panic         = "abort"
incremental   = false
overflow-checks = false

[profile.release-wasm]
inherits      = "release"
opt-level     = "z"      # size over speed for the editor blob
lto           = "fat"
codegen-units = 1
