[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
# --- Core Math & Graph ---
petgraph = "0.6"
smallvec = { version = "1.13", features = ["serde", "const_generics", "const_new"] }
rustc-hash = "2.0"
hashbrown = "0.14"
bumpalo = { version = "3.16", features = ["collections"] }
rayon = "1.10"

# --- Parsing & Serialisation ---
tree-sitter = "0.22"
tree-sitter-dart = "0.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
regex = "1.10"
thiserror = "1.0"
tracing = "0.1"

# --- Optional Heavy Dependencies (Gated for Cross-Platform Sanity) ---
rocksdb = { version = "0.22", optional = true }
z3 = { version = "0.12", optional = true }

[features]
default = []
# Persistence requires C++ Build Tools / LLVM (RocksDB).
# Feature name matches the cfg gate at src/lib.rs:41.
persist = ["dep:rocksdb"]
# SMT Proofs require Z3 installation.
smt-proofs = ["dep:z3"]
# Native dart-analyzer sidecar (uses std::process; not WASM-compatible).
analyzer-bridge = []
# Full suite for CI/CD.
full = ["persist", "smt-proofs", "analyzer-bridge"]

[lib]
name = "engine_core"
path = "src/lib.rs"
