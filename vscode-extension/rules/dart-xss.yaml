id: dart.security.xss-html-widget
message: "User-controlled value flows into an HTML rendering sink. Sanitize before rendering."
severity: WARNING
languages: [dart]
mode: taint

pattern-sources:
  - pattern: "request.body.$FIELD"
  - pattern: "request.query.$FIELD"
  - pattern: "request.params.$FIELD"
  - pattern: "context.request.$FIELD"

pattern-sinks:
  - pattern: "Html(data: $ARG)"
  - pattern: "Markdown(data: $ARG)"

pattern-sanitizers:
  - pattern: "sanitizeHtml($ARG)"
  - pattern: "escapeHtml($ARG)"
  - pattern: "DOMPurify.sanitize($ARG)"
