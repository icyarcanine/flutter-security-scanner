id: dart.security.command-injection
message: "User-controlled value flows into a command execution sink. Avoid shell execution or pass validated allowlisted arguments."
severity: ERROR
languages: [dart]
mode: taint

pattern-sources:
  - pattern: "window.prompt($ARG)"
  - pattern: "TextEditingController.text"
  - pattern: "TextField.controller.text"
  - pattern: "FormField.onChanged($ARG)"
  - pattern: "onSubmitted($ARG)"
  - pattern: "Uri.base.queryParameters[$KEY]"
  - pattern: "Platform.environment[$KEY]"
  - pattern: "stdin.readLineSync()"
  - pattern: "File.readAsString()"
  - pattern: "SharedPreferences.getString($KEY)"
  - pattern: "SharedPreferences.getStringList($KEY)"
  - pattern: "SecureStorage.read(key: $KEY)"
  - pattern: "http.Client.get($ARG)"
  - pattern: "http.Client.post($ARG)"
  - pattern: "dart:io.HttpRequest.uri"
  - pattern: "WebSocket.stream"

pattern-sinks:
  - pattern: "Process.run($ARG, $REST)"
  - pattern: "Process.start($ARG, $REST)"
  - pattern: "Process.runSync($ARG, $REST)"
  - pattern: "Runtime.exec($ARG)"
  - pattern: "Process.runInShell($ARG)"
  - pattern: "Process.startInShell($ARG)"
  - pattern: "Isolate.spawnUri($ARG)"

pattern-sanitizers:
  - pattern: "ArgumentList($ARG)"
  - pattern: "argParser.parse($ARG)"
  - pattern: "RegExp.hasMatch($ARG)"
